<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level-Up Bot Dashboard</title>
<style>
  :root{--bg:#EDF0F4;--panel:#fff;--ink:#1A2230;--muted:#667085;--line:#D9DEE6;--accent:#2B59FF;
    --ok:#12805C;--warn:#B7791F;--bad:#C2352B;--bar:#E3E8F0;--log-bg:#161C28;--log-ink:#D5DCEA}
  @media (prefers-color-scheme:dark){:root{--bg:#10141C;--panel:#182030;--ink:#E8ECF4;--muted:#93A0B8;
    --line:#26314A;--accent:#6B8CFF;--ok:#3CC58F;--warn:#E3A83F;--bad:#F0675D;--bar:#222D44;--log-bg:#0B0F16}}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    padding:20px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px}
  .state{display:flex;align-items:center;gap:8px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
  .dot.off{background:var(--bad)}
  button,input{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  button{font-weight:600;padding:8px 14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.small{padding:3px 10px;font-size:13px}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  input{padding:8px 12px;min-width:0}
  main{padding:24px clamp(16px,4vw,40px);display:grid;gap:24px;max-width:1360px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat b{display:block;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  section>h2{margin:0;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:13px;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:0}
  .num{font-variant-numeric:tabular-nums}
  .gain{color:var(--ok);font-weight:600}
  .tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;
    background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
  .tag.ONLINE,.tag.IN_MATCH{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .tag.ERROR,.tag.OFFLINE{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .tag.SEARCHING,.tag.CONNECTING{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .add{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .add input{flex:1 1 150px}
  #msg{padding:0 18px 10px;font-size:13px;color:var(--muted);min-height:20px}
  #log{background:var(--log-bg);color:#D5DCEA;margin:0;padding:14px 18px;height:420px;overflow:auto;
    font:12.5px/1.6 Consolas,"SF Mono",monospace;white-space:pre-wrap;word-break:break-word}
  .l-error{color:#FF8C84}.l-success{color:#6FE0B0}.l-warning{color:#F2C46D}
  .empty{padding:28px 18px;color:var(--muted)}
  .notice{padding:10px 18px;font-size:13px;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);display:none}
</style>
</head>
<body>
<header>
  <div><h1>Level-Up Bot</h1><div class="sub">Live dashboard · refreshes every 3 seconds</div></div>
  <div class="state"><span class="dot" id="dot"></span><span id="stateText">Connecting…</span></div>
</header>
<div class="notice" id="notice">Can't reach the bot server. Make sure Main.py is running.</div>

<main>
  <div class="stats">
    <div class="stat"><b id="sAccounts">0</b><span>Accounts</span></div>
    <div class="stat"><b id="sMatches">0</b><span>Matches played</span></div>
    <div class="stat"><b id="sExp">0</b><span>EXP gained</span></div>
    <div class="stat"><b id="sUptime">00:00:00</b><span>Uptime</span></div>
  </div>

  <div class="grid">
    <section>
      <h2>Accounts</h2>
      <form class="add" id="addForm">
        <input id="fUid" placeholder="Guest UID" autocomplete="off">
        <input id="fPwd" placeholder="Password" type="password" autocomplete="off">
        <input id="fTok" placeholder="…or access token" autocomplete="off">
        <button class="primary" type="submit">Add account</button>
      </form>
      <div id="msg" role="status"></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Nickname</th><th>UID</th><th>Region</th><th>Level</th><th>EXP</th><th>Gained</th>
            <th>Matches</th><th>Likes</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">No accounts yet. Add one above.</div>
    </section>

    <section>
      <h2>Live log <button class="small" id="clearBtn" type="button">Clear</button></h2>
      <pre id="log" aria-live="polite"></pre>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = n => Number(n || 0).toLocaleString();
const fmt = s => { s = Math.max(0, Math.floor(s));
  return [s/3600, s%3600/60, s%60].map(n => String(Math.floor(n)).padStart(2,"0")).join(":"); };

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
}

function render(d){
  $("dot").className = "dot on"; $("stateText").textContent = "Online";
  $("notice").style.display = "none";
  const acc = d.accounts || [];
  $("sAccounts").textContent = nf(d.total_accounts);
  $("sMatches").textContent = nf(d.total_matches);
  $("sExp").textContent = "+" + nf(d.total_gained_exp);
  $("sUptime").textContent = fmt(d.uptime);
  $("empty").style.display = acc.length ? "none" : "block";
  $("rows").innerHTML = acc.map(a => `<tr>
    <td>${esc(a.nickname)}</td><td class="num">${esc(a.uid)}</td><td>${esc(a.region)}</td>
    <td class="num">${esc(a.level)}</td><td class="num">${nf(a.current_exp)}</td>
    <td class="num gain">+${nf(a.gained_exp)}</td>
    <td class="num">${nf(a.matches_played)}${a.active_matches ? " (" + esc(a.active_matches) + " live)" : ""}</td>
    <td class="num">${nf(a.likes)}</td>
    <td><span class="tag ${esc(a.status)}">${esc(a.status)}</span></td>
    <td><button class="small" data-act="refresh" data-uid="${esc(a.uid)}">Refresh</button>
        <button class="small danger" data-act="delete" data-uid="${esc(a.uid)}">Remove</button></td>
  </tr>`).join("");

  const box = $("log");
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = (d.logs || []).map(l =>
    `<span class="l-${esc(l.level)}">[${esc(l.time)}] ${esc(l.message)}</span>`).join("\n");
  if (stick) box.scrollTop = box.scrollHeight;
}

async function refresh(){
  try{
    const r = await fetch("/api/stats", {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    render(await r.json());
  }catch(e){
    $("dot").className = "dot off"; $("stateText").textContent = "Offline";
    $("notice").style.display = "block";
  }
}

$("rows").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const uid = b.dataset.uid;
  if(b.dataset.act === "delete" && !confirm("Remove account " + uid + "?")) return;
  b.disabled = true;
  try{ await post("/api/account/" + b.dataset.act, {uid}); }catch(_){}
  refresh();
});

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const uid = $("fUid").value.trim(), pwd = $("fPwd").value.trim(), tok = $("fTok").value.trim();
  const body = tok ? {token:tok} : {uid, password:pwd};
  if(!tok && (!uid || !pwd)){ $("msg").textContent = "Enter UID + password, or a token."; return; }
  try{
    const r = await post("/api/account/add", body);
    $("msg").textContent = r.status === "ok" ? "Account added. Logging in…" : (r.error || "Failed to add.");
    if(r.status === "ok") e.target.reset();
  }catch(_){ $("msg").textContent = "Server unreachable."; }
  refresh();
});

$("clearBtn").onclick = () => { $("log").innerHTML = ""; };
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
